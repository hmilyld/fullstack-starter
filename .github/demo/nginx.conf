# Demo 镜像站点配置：三套前端各占一个端口，共用同一套 Java 后端
# 后端在容器内监听 127.0.0.1:8088（见 application.yml）
#
# X-Forwarded-Host/Port/Proto 配合后端的 SERVER_FORWARD_HEADERS_STRATEGY=FRAMEWORK，
# 让后端以浏览器的真实地址判断同源，代理后的 POST 不会被 CORS 拦截。

server {
    listen 5173;
    server_name localhost;
    client_max_body_size 1g;

    # 压缩前端资源与接口 JSON
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 安全响应头。注意：子 location 里一旦出现 add_header 就会覆盖这些 server 级配置，
    # 因此 /assets/ 中重复声明；需要 CSP 时在这里追加即可。
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'" always;

    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;

    # React 静态文件
    location /assets/ {
        root /srv/react;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location = /index.html {
        root /srv/react;
        expires -1;
    }

    location / {
        root /srv/react;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        expires 1h;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 30s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://127.0.0.1:8088;
    }
    location /openapi.json {
        proxy_pass http://127.0.0.1:8088;
    }
    location /swagger-ui/ {
        proxy_pass http://127.0.0.1:8088;
    }
    location /redoc {
        proxy_pass http://127.0.0.1:8088;
    }
}

