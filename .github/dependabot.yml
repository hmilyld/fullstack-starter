    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # Docker base images are updated manually: the generated Dockerfiles are
  # strings in src/generator.ts, and Dependabot's Docker updater cannot update
  # them reliably (the apk/eclipse-temurin tags are not semver).
