# Template dependencies ship to generated projects. Version updates are grouped
# to minor/patch changes; major upgrades are handled manually. Security updates
# are not affected by ignore.update-types and still open immediately.

version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: 'chore(deps)'
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: '/templates/frontend-react'
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: 'chore(deps)'
