name: Build demo image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-demo
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Build generator
        run: pnpm run build

      - name: Verify permission catalogs match across backends
        run: pnpm run sync:permissions:catalog

      - name: Verify design spec matches templates
        run: pnpm run sync:design:check

      - name: Read release version
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Generate demo project (React + Python)
        run: pnpm exec tsx scripts/generate-demo.ts "$RUNNER_TEMP/generated" demo react python

      - name: Lint generated frontend
        working-directory: ${{ runner.temp }}/generated/demo/frontend
        run: |
          npm ci
          npm run lint

      - name: Generate demo project (Svelte + Python)
        run: pnpm exec tsx scripts/generate-demo.ts "$RUNNER_TEMP/generated-svelte" demo-svelte svelte python

      - name: Check and build generated Svelte frontend
        working-directory: ${{ runner.temp }}/generated-svelte/demo-svelte/frontend
        run: |
          npm ci
          npm run lint
          npm run check
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/generated/demo
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:v${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.title=${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
