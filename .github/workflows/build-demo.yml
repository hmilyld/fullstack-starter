name: Build demo image (React/Vue/Svelte + Java)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-demo
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Build generator
        run: pnpm run build

      - name: Verify permission catalogs match across backends
        run: pnpm run sync:permissions:catalog

      - name: Verify design spec matches templates
        run: pnpm run sync:design:check

      - name: Read release version
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      # 镜像内的三套前端和一套 Java 后端都来自生成结果，
      # 这样 CI 镜像始终等同于用户拿到手的项目。
      - name: Generate demo projects (React / Vue / Svelte + Java)
        run: |
          pnpm exec tsx scripts/generate-demo.ts "$RUNNER_TEMP/generated-react" demo-react react java
          pnpm exec tsx scripts/generate-demo.ts "$RUNNER_TEMP/generated-vue" demo-vue vue java
          pnpm exec tsx scripts/generate-demo.ts "$RUNNER_TEMP/generated-svelte" demo-svelte svelte java

      - name: Lint generated React frontend
        working-directory: ${{ runner.temp }}/generated-react/demo-react/frontend
        run: |
          npm ci
          npm run lint

      - name: Lint generated Vue frontend
        working-directory: ${{ runner.temp }}/generated-vue/demo-vue/frontend
        run: |
          npm ci
          npm run lint

      - name: Lint and check generated Svelte frontend
        working-directory: ${{ runner.temp }}/generated-svelte/demo-svelte/frontend
        run: |
          npm ci
          npm run lint
          npm run check

      # 把三套前端和一套 Java 后端拼成镜像构建上下文：
      # react/ vue/ svelte/ backend/ Dockerfile nginx.conf .dockerignore
      - name: Assemble demo image context
        run: |
          mkdir -p "$RUNNER_TEMP/image"
          cp -a "$RUNNER_TEMP/generated-react/demo-react/frontend" "$RUNNER_TEMP/image/react"
          cp -a "$RUNNER_TEMP/generated-vue/demo-vue/frontend" "$RUNNER_TEMP/image/vue"
          cp -a "$RUNNER_TEMP/generated-svelte/demo-svelte/frontend" "$RUNNER_TEMP/image/svelte"
          cp -a "$RUNNER_TEMP/generated-react/demo-react/backend" "$RUNNER_TEMP/image/backend"
          cp .github/demo/Dockerfile .github/demo/nginx.conf .github/demo/.dockerignore "$RUNNER_TEMP/image/"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/image
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:v${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.title=${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
