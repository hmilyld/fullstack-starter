name: Build demo image

on:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read release version
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "v${{ steps.version.outputs.version }}" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version ${{ steps.version.outputs.version }}" >&2
            exit 1
          fi

      - name: Select image tags
        id: image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            {
              echo "tags<<EOF"
              echo "${repo}:${VERSION}"
              echo "${repo}:v${VERSION}"
              echo "${repo}:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "tags=${repo}:edge" >> "$GITHUB_OUTPUT"
          fi

      # 镜像内的三套前端和一套 Java 后端都来自生成结果，
      # 这样镜像始终等同于用户拿到手的项目。
      - name: Generate demo projects (React / Vue / Svelte + Java)
        run: |
          pnpm exec tsx scripts/generate-demo.ts "$RUNNER_TEMP/generated-react" demo-react react java
          pnpm exec tsx scripts/generate-demo.ts "$RUNNER_TEMP/generated-vue" demo-vue vue java
          pnpm exec tsx scripts/generate-demo.ts "$RUNNER_TEMP/generated-svelte" demo-svelte svelte java

      # 把三套前端和一套 Java 后端拼成镜像构建上下文：
      # react/ vue/ svelte/ backend/ Dockerfile nginx.conf .dockerignore
      - name: Assemble demo image context
        run: |
          mkdir -p "$RUNNER_TEMP/image"
          cp -a "$RUNNER_TEMP/generated-react/demo-react/frontend" "$RUNNER_TEMP/image/react"
          cp -a "$RUNNER_TEMP/generated-vue/demo-vue/frontend" "$RUNNER_TEMP/image/vue"
          cp -a "$RUNNER_TEMP/generated-svelte/demo-svelte/frontend" "$RUNNER_TEMP/image/svelte"
          cp -a "$RUNNER_TEMP/generated-react/demo-react/backend" "$RUNNER_TEMP/image/backend"
          cp .github/demo/Dockerfile .github/demo/nginx.conf .github/demo/.dockerignore "$RUNNER_TEMP/image/"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ runner.temp }}/image
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.title=${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
