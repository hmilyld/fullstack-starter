name: Build demo image

on:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read release version
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "v${{ steps.version.outputs.version }}" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version ${{ steps.version.outputs.version }}" >&2
            exit 1
          fi

      # 镜像内的三套前端和一套 Java 后端都来自生成结果，
      # 这样镜像始终等同于用户拿到手的项目。
      - name: Generate demo projects (React / Vue / Svelte + Java)
        run: |
          pnpm exec tsx scripts/generate-demo.ts "$RUNNER_TEMP/generated-react" demo-react react java
          pnpm exec tsx scripts/generate-demo.ts "$RUNNER_TEMP/generated-vue" demo-vue vue java
          pnpm exec tsx scripts/generate-demo.ts "$RUNNER_TEMP/generated-svelte" demo-svelte svelte java

      # 把三套前端和一套 Java 后端拼成镜像构建上下文：
      # react/ vue/ svelte/ backend/ Dockerfile nginx.conf .dockerignore
      - name: Assemble demo image context
        run: |
          mkdir -p "$RUNNER_TEMP/image"
          cp -a "$RUNNER_TEMP/generated-react/demo-react/frontend" "$RUNNER_TEMP/image/react"
          cp -a "$RUNNER_TEMP/generated-vue/demo-vue/frontend" "$RUNNER_TEMP/image/vue"
          cp -a "$RUNNER_TEMP/generated-svelte/demo-svelte/frontend" "$RUNNER_TEMP/image/svelte"
          cp -a "$RUNNER_TEMP/generated-react/demo-react/backend" "$RUNNER_TEMP/image/backend"
          cp .github/demo/Dockerfile .github/demo/nginx.conf .github/demo/.dockerignore "$RUNNER_TEMP/image/"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ runner.temp }}/image
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:v${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.title=${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
