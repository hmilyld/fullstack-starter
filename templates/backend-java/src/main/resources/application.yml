server:
  port: 8088

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
  datasource:
    url: jdbc:sqlite:./data/app.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  jackson:
    # 与 Python 侧对齐：契约要求 data / parent 等可空字段始终出现在 JSON 中。
    # 因此不使用 non_null 过滤，null 值照常序列化。
    default-property-inclusion: always
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB

sa-token:
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false
  is-read-header: true
  is-read-body: false
  is-read-cookie: false

app:
  cors-origins: http://localhost:5173
  rate-limit:
    # 登录/注册按 IP 的滑动窗口限流，与 Python 侧一致
    max-attempts: 5
    window-ms: 60000
  audit:
    exclude-paths:
      - /api/auth
  data:
    tmp-dir: ./data/tmp
    max-import-size-bytes: 1073741824

# OpenAPI 3 + Swagger UI
# 路径刻意对齐 Python 侧：/docs 与 /openapi.json，
# 这样 dev.sh 的提示文案、nginx 反向代理与两栈文档地址完全一致。
springdoc:
  api-docs:
    path: /openapi.json
  swagger-ui:
    path: /docs
    # 关闭默认的 petstore 示例地址
    disable-swagger-default-url: true
    operations-sorter: alpha
    tags-sorter: alpha
  paths-to-match: /api/**
