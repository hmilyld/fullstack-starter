[project]
name = "backend"
version = "1.0.0"
description = "FastAPI backend scaffold"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "pyjwt>=2.8.0",
    "bcrypt>=4.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "pydantic[email]>=2.0.0",
    "httpx>=0.27.0",
    "pyzipper>=0.3.6",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "anyio>=4.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "ASYNC", "RUF"]
# RUF001-003：中文全角标点在字符串/注释里是正常用法，不是歧义字符
ignore = ["N803", "N815", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.fastapi]
entrypoint = "app.main:app"
